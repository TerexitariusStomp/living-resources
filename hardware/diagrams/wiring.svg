<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" font-family="monospace" font-size="13">
  <rect width="1100" height="760" fill="#1c2023"/>
  <text x="30" y="36" fill="#eaeaea" font-size="20" font-weight="bold">EcoCell universal node — wiring diagram</text>
  <text x="30" y="56" fill="#8a8f94">All heads on every board · color = net · labels = XIAO pin → head pin</text>

  <!-- center board -->
  <rect x="430" y="160" width="240" height="380" rx="10" fill="#24504f" stroke="#3aa08f" stroke-width="2"/>
  <text x="550" y="190" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">XIAO ESP32-S3 Sense</text>
  <text x="550" y="210" fill="#bfe8e0" text-anchor="middle" font-size="11">onboard: OV2640 · PDM mic · µSD slot</text>

  <!-- pins left -->
  <g fill="#dfe7ea">
    <text x="445" y="245">D0 ·GPIO1</text>
    <text x="445" y="280">D1 ·GPIO2</text>
    <text x="445" y="315">D2 ·GPIO3</text>
    <text x="445" y="350">D3 ·GPIO4</text>
    <text x="445" y="420">D6 ·GPIO43</text>
    <text x="445" y="455">D7 ·GPIO44</text>
    <text x="445" y="505">3V3</text>
    <text x="445" y="525">GND</text>
  </g>
  <g fill="#dfe7ea">
    <text x="585" y="245" text-anchor="end">D4 ·GPIO5</text>
    <text x="585" y="265" text-anchor="end">D5 ·GPIO6</text>
    <text x="585" y="320" text-anchor="end">D8 ·GPIO7</text>
    <text x="585" y="340" text-anchor="end">D9 ·GPIO9</text>
    <text x="585" y="360" text-anchor="end">D10·GPIO10</text>
  </g>
  <g fill="#9fd5cc" font-size="10">
    <text x="445" y="258">RTC wake</text>
    <text x="445" y="293">ADC1</text>
    <text x="445" y="328">ADC1</text>
    <text x="445" y="363">PWM</text>
    <text x="445" y="433">UART TX</text>
    <text x="445" y="468">UART RX</text>
    <text x="585" y="232" text-anchor="end">I2C SDA</text>
    <text x="585" y="278" text-anchor="end">I2C SCL</text>
    <text x="585" y="333" text-anchor="end">SPI (spare)</text>
  </g>

  <!-- LEFT SIDE HEADS -->
  <!-- PIR -->
  <rect x="60" y="200" width="160" height="60" rx="8" fill="#4a3a5a" stroke="#a07ac0" stroke-width="1.5"/>
  <text x="140" y="225" fill="#e8d8f5" text-anchor="middle" font-weight="bold">PIR (AM312)</text>
  <text x="140" y="245" fill="#c0a8d4" text-anchor="middle" font-size="11">wake trigger</text>
  <line x1="220" y1="232" x2="430" y2="240" stroke="#a07ac0" stroke-width="2.5"/>
  <text x="320" y="228" fill="#a07ac0" font-size="10">OUT→D0</text>

  <!-- Hydrophone -->
  <rect x="60" y="290" width="160" height="70" rx="8" fill="#1f4a6e" stroke="#4f9fd0" stroke-width="1.5"/>
  <text x="140" y="315" fill="#d0e8f5" text-anchor="middle" font-weight="bold">Hydrophone</text>
  <text x="140" y="333" fill="#9cc4e0" text-anchor="middle" font-size="11">piezo + preamp</text>
  <text x="140" y="349" fill="#9cc4e0" text-anchor="middle" font-size="10">(potted, lead to water)</text>
  <line x1="220" y1="325" x2="430" y2="275" stroke="#4f9fd0" stroke-width="2.5"/>
  <text x="300" y="295" fill="#4f9fd0" font-size="10">OUT→D1</text>

  <!-- Ultrasonic -->
  <rect x="60" y="390" width="160" height="60" rx="8" fill="#1f4a6e" stroke="#4f9fd0" stroke-width="1.5"/>
  <text x="140" y="415" fill="#d0e8f5" text-anchor="middle" font-weight="bold">ICS-40730</text>
  <text x="140" y="435" fill="#9cc4e0" text-anchor="middle" font-size="11">ultrasonic 20–100 kHz</text>
  <line x1="220" y1="420" x2="430" y2="310" stroke="#4f9fd0" stroke-width="2.5"/>
  <text x="300" y="358" fill="#4f9fd0" font-size="10">OUT→D2</text>

  <!-- Emit driver -->
  <rect x="60" y="480" width="160" height="80" rx="8" fill="#6e3a2a" stroke="#d07850" stroke-width="1.5"/>
  <text x="140" y="505" fill="#f5d8c8" text-anchor="middle" font-weight="bold">Emit driver</text>
  <text x="140" y="523" fill="#e0a88c" text-anchor="middle" font-size="11">MOSFET + 40kHz xdcr</text>
  <text x="140" y="541" fill="#e0a88c" text-anchor="middle" font-size="10">CONSENT-GATED</text>
  <line x1="220" y1="510" x2="430" y2="345" stroke="#d07850" stroke-width="2.5"/>
  <text x="290" y="418" fill="#d07850" font-size="10">D3→100Ω→gate</text>

  <!-- UART backhaul -->
  <rect x="60" y="590" width="160" height="70" rx="8" fill="#2a4a2a" stroke="#58a858" stroke-width="1.5"/>
  <text x="140" y="615" fill="#d8f0d0" text-anchor="middle" font-weight="bold">Backhaul UART</text>
  <text x="140" y="633" fill="#a8d098" text-anchor="middle" font-size="11">LoRa RNode / sat / serial</text>
  <line x1="220" y1="605" x2="430" y2="415" stroke="#58a858" stroke-width="2.5"/>
  <line x1="220" y1="645" x2="430" y2="450" stroke="#58a858" stroke-width="2.5"/>
  <text x="300" y="500" fill="#58a858" font-size="10">TX↔D7 · RX↔D6</text>

  <!-- RIGHT SIDE: I2C bus -->
  <rect x="880" y="170" width="170" height="230" rx="8" fill="#3a3a2a" stroke="#c8b058" stroke-width="1.5"/>
  <text x="965" y="195" fill="#f0e4b0" text-anchor="middle" font-weight="bold">I2C bus (D4/D5)</text>

  <rect x="900" y="210" width="130" height="46" rx="6" fill="#505038" stroke="#c8b058"/>
  <text x="965" y="229" fill="#f0e4b0" text-anchor="middle">BME280 ·0x76</text>
  <text x="965" y="245" fill="#c8bc80" text-anchor="middle" font-size="10">T/RH/P</text>

  <rect x="900" y="266" width="130" height="46" rx="6" fill="#505038" stroke="#c8b058"/>
  <text x="965" y="285" fill="#f0e4b0" text-anchor="middle">BH1750 ·0x23</text>
  <text x="965" y="301" fill="#c8bc80" text-anchor="middle" font-size="10">light</text>

  <rect x="900" y="322" width="130" height="56" rx="6" fill="#505038" stroke="#c8b058"/>
  <text x="965" y="341" fill="#f0e4b0" text-anchor="middle">AD7746 ·0x48</text>
  <text x="965" y="357" fill="#c8bc80" text-anchor="middle" font-size="10">C4D → electrodes</text>

  <line x1="670" y1="240" x2="880" y2="240" stroke="#c8b058" stroke-width="2.5"/>
  <line x1="670" y1="262" x2="880" y2="262" stroke="#c8b058" stroke-width="2.5"/>
  <text x="760" y="232" fill="#c8b058" font-size="10">SDA</text>
  <text x="760" y="276" fill="#c8b058" font-size="10">SCL</text>

  <!-- power rail legend -->
  <rect x="430" y="600" width="640" height="120" rx="8" fill="#24282b" stroke="#4a5054"/>
  <text x="450" y="625" fill="#eaeaea" font-weight="bold">Power + ground rails</text>
  <text x="450" y="647" fill="#b8c0c5" font-size="11">3V3 and GND rails run along the carrier — every head takes VCC/GND</text>
  <text x="450" y="667" fill="#b8c0c5" font-size="11">from the rails; only signal lines go to specific pins above.</text>
  <text x="450" y="695" fill="#9fd5cc" font-size="11">Spare: D8–D10 (SPI) — second SD, GPS, display, or future heads.</text>

  <!-- emit detail inset -->
  <rect x="60" y="90" width="300" height="80" rx="8" fill="#2a3236" stroke="#d07850" stroke-width="1"/>
  <text x="75" y="112" fill="#f0d8c8" font-weight="bold" font-size="12">Emit driver detail</text>
  <text x="75" y="132" fill="#c0a890" font-size="10">D3 → 100Ω → gate | source→GND</text>
  <text x="75" y="148" fill="#c0a890" font-size="10">xdcr: 3V3 ↔ drain · flyback diode across</text>
  <text x="75" y="163" fill="#d07850" font-size="10">fw ceiling: ≤50ms on / ≥950ms off</text>
</svg>
