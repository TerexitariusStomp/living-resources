# SPDX-License-Identifier: AGPL-3.0-or-later
name = "connectome-compute-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
account_id = "f6aff821e92502a4c148dfdcbc082a14"

workers_dev = true

routes = [
  { pattern = "templeearth.cc", custom_domain = true },
  { pattern = "www.templeearth.cc", custom_domain = true },
]

[assets]
directory = "../../site/dist"
binding = "ASSETS"
# the Worker routes every request — API endpoints must never be shadowed
# by the asset layer (404-page handling would otherwise answer /info etc.
# without invoking the Worker). Unmatched paths fall through to ASSETS,
# which serves the styled site/dist/404.html.
run_worker_first = true
not_found_handling = "404-page"

# NOTE: Free plan (~10ms CPU/invocation, no cpu_ms override). Consequence:
# /verdict {"connectome":"all"} answers an honest JSON 503 — call once per
# connectome. The two largest substrates (medulla ~17ms, hemibrain ~9ms
# warm) can still exceed the budget alone on cold isolates.

[[kv_namespaces]]
binding = "RECEIPTS"
id = "9898f2de3465417fb191f2e68db6f832"

[[kv_namespaces]]
binding = "WAITLIST"
id = "16d6453106a74698b45e782b0d984882"

[observability]
enabled = false
